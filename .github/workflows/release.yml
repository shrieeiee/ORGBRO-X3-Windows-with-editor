name: Release

on:
  push:
    tags: ["studio-v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ORGBRO_X3_Studio-win-x64
      - uses: softprops/action-gh-release@v2
        with:
          name: ORGBRO X3 Studio ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **ORGBRO X3 Studio** for Windows 11 x64 — design stickers & labels and print them to an ORGBRO X3 over Bluetooth.

            > ⚠️ This fork is vibe coded (AI-assisted, not carefully hand-reviewed). Use at your own risk.

            * **ORGBRO_X3_Studio-win-x64.zip** — recommended. Unzip anywhere and run `ORGBRO_X3_Studio.exe` inside the folder.
            * **ORGBRO_X3_Studio-portable.exe** — single file, starts more slowly and is more likely to trigger antivirus warnings.

            Windows SmartScreen may warn because the app is not code-signed: click *More info → Run anyway*.
          files: |
            ORGBRO_X3_Studio-win-x64.zip
            ORGBRO_X3_Studio-portable.exe
