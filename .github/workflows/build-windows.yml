name: Build Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements.txt

      - name: Build ORGBRO_X3_Studio.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ORGBRO_X3_Studio
          --add-data "editor.html;."
          --hidden-import serial.tools.list_ports
          --collect-all PIL --collect-all webview
          --collect-all clr_loader --collect-all pythonnet
          orgbro_x3_studio.py

      - uses: actions/upload-artifact@v4
        with:
          name: ORGBRO_X3_Studio-win-x64
          path: dist/ORGBRO_X3_Studio.exe
