<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="orgbro-token" content="__ORGBRO_TOKEN__">
    <title>ORGBRO X3 Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@700&family=Courier+Prime:wght@700&family=Fira+Code:wght@700&family=Inter:wght@800&family=Libre+Baskerville:ital,wght@0,700;1,400&family=Montserrat:wght@900&family=Oswald:wght@700&family=Pacifico&family=Press+Start+2P&family=Roboto+Mono:wght@700&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: #0f172a; margin: 0; color: #f8fafc; }

        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; background: #1e293b; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 10; }
        .topbar h1 { font-size: 1.15rem; margin: 0; color: #38bdf8; }
        .topbar .subtitle { color: #94a3b8; font-size: 0.8rem; }
        .pill { font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px solid #475569; color: #cbd5e1; white-space: nowrap; }
        .pill.on { background: #064e3b; border-color: #10b981; color: #6ee7b7; }
        .pill.off { background: #451a03; border-color: #f59e0b; color: #fcd34d; }

        .layout { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(420px, 1fr); gap: 18px; padding: 18px 20px; max-width: 1500px; margin: 0 auto; }
        @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
        .side-col { position: sticky; top: 72px; align-self: start; max-height: calc(100vh - 90px); overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        @media (max-width: 960px) { .side-col { position: static; max-height: none; } }

        .panel { background: #1e293b; border: 1px solid #334155; padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; }
        .side-col .panel { margin-bottom: 0; }
        .panel h3 { margin: 0 0 10px; font-size: 0.9rem; color: #38bdf8; }
        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.85rem; margin-bottom: 8px; }
        .row:last-child { margin-bottom: 0; }

        .mode-btn { background: #0f172a; border: 1px solid #475569; color: white; padding: 8px 14px; font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .mode-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

        .system-font-btn { background: #8b5cf6; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
        .system-font-btn:hover { background: #7c3aed; }

        .action-bar { display: flex; gap: 10px; margin-bottom: 14px; }
        .add-btn { flex: 1; padding: 12px; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; font-size: 0.95rem; }
        .add-text-btn { background: #0284c7; color: white; }
        .add-text-btn:hover { background: #0369a1; }
        .add-img-btn { background: #475569; color: white; }
        .add-img-btn:hover { background: #334155; }

        .blocks-container { display: flex; flex-direction: column; gap: 12px; }
        .block-item { background: #334155; border: 1px solid #475569; border-radius: 8px; padding: 12px; }
        .block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.8rem; font-weight: 700; color: #38bdf8; text-transform: uppercase; }
        .controls-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }

        select, input[type="number"], input[type="text"] { padding: 6px; border: 1px solid #64748b; background: #0f172a; color: white; border-radius: 4px; font-size: 0.85rem; font-family: inherit; }
        input[type="range"] { accent-color: #38bdf8; }
        .toggle-btn { background: #1e293b; border: 1px solid #64748b; color: white; padding: 6px 10px; font-weight: 600; border-radius: 4px; cursor: pointer; font-size: 0.85rem; min-width: 34px; }
        .toggle-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
        .btn-move, .btn-delete, .btn-small { border: none; cursor: pointer; padding: 5px 9px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
        .btn-move, .btn-small { background: #475569; color: white; }
        .btn-small:hover, .btn-move:hover { background: #64748b; }
        .btn-delete { background: #ef4444; color: white; }
        textarea { width: 100%; padding: 8px; border: 1px solid #64748b; background: #0f172a; color: white; border-radius: 6px; font-size: 0.95rem; font-family: inherit; resize: vertical; }
        .muted { color: #94a3b8; font-size: 0.8rem; }

        .print-actions { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-top: 10px; }
        .print-btn { background: #10b981; color: white; border: none; padding: 13px; font-weight: 800; font-size: 1rem; border-radius: 8px; cursor: pointer; }
        .print-btn:hover { background: #059669; }
        .print-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .cancel-btn { background: #ef4444; }
        .cancel-btn:hover { background: #dc2626; }
        .save-btn { background: #475569; color: white; border: none; padding: 13px; font-weight: 700; border-radius: 8px; cursor: pointer; }
        .save-btn:hover { background: #64748b; }

        .progress { height: 8px; background: #0f172a; border-radius: 999px; overflow: hidden; margin-top: 12px; border: 1px solid #334155; }
        .progress > div { height: 100%; width: 0%; background: #10b981; transition: width 0.2s; }
        #statusText { margin-top: 8px; font-size: 0.85rem; color: #cbd5e1; }
        details { margin-top: 8px; }
        summary { cursor: pointer; font-size: 0.8rem; color: #94a3b8; }
        #logBox { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px; font-family: Consolas, monospace; font-size: 0.75rem; color: #cbd5e1; max-height: 140px; overflow-y: auto; white-space: pre-wrap; margin-top: 6px; }

        .preview-box { text-align: center; }
        #canvasLabel { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 8px; color: #94a3b8; }
        .canvas-wrap { max-height: 70vh; overflow-y: auto; border-radius: 4px; }
        canvas#canvas { width: 100%; height: auto; background: #ffffff; border: 1px solid #cbd5e1; image-rendering: pixelated; display: block; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid #38bdf8; color: #f8fafc; padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.25s; max-width: 80vw; z-index: 50; }
        #toast.show { opacity: 1; }
        #toast.error { border-color: #ef4444; }
        #toast.ok { border-color: #10b981; }
    </style>
</head>
<body>

<header class="topbar">
    <div>
        <h1>ORGBRO X3 Studio</h1>
        <div class="subtitle">Design stickers &amp; labels, then print straight to the ORGBRO X3 over Bluetooth</div>
    </div>
    <span id="backendPill" class="pill">Connecting…</span>
</header>

<main class="layout">
    <!-- ================= LEFT: editor ================= -->
    <section>
        <div class="panel">
            <h3>Print Layout Mode</h3>
            <div class="row">
                <button id="btnRight57" class="mode-btn active" onclick="setLayoutMode('57_right')">57mm Roll (Right Zone of 80mm Canvas)</button>
                <button id="btnFull80" class="mode-btn" onclick="setLayoutMode('80_full')">Standard Full 80mm Roll (864px)</button>
            </div>
        </div>

        <div class="panel">
            <h3>Fonts</h3>
            <div class="row">
                <span class="muted" style="flex:1">Add every font installed on this PC to the font lists:</span>
                <button class="system-font-btn" onclick="loadSystemFonts()">🔍 Scan System Fonts</button>
            </div>
        </div>

        <div class="panel">
            <h3>Sticker Roll Batch Settings</h3>
            <div class="row">
                <label>Repeat Layout:
                    <input type="number" id="repeatCount" value="1" min="1" max="50" style="width: 64px;" onchange="renderCanvas()"> times
                </label>
                <label><input type="checkbox" id="showCutLines" checked onchange="renderCanvas()"> Add Cut-Line Dividers</label>
                <label>Gap Between Stickers:
                    <input type="number" id="stickerGap" value="30" min="0" max="200" style="width: 64px;" onchange="renderCanvas()"> px
                </label>
            </div>
        </div>

        <div class="action-bar">
            <button class="add-btn add-text-btn" onclick="addTextBlock()">+ Add Text Block</button>
            <button class="add-btn add-img-btn" onclick="triggerImageUpload()">+ Add Image Block</button>
            <input type="file" id="hiddenFileInput" accept="image/*" style="display: none;" onchange="addImageBlock(event)">
        </div>

        <div id="blocksContainer" class="blocks-container"></div>
    </section>

    <!-- ================= RIGHT: printer + preview ================= -->
    <aside class="side-col">
        <div class="panel">
            <h3>Printer</h3>
            <div class="row">
                <select id="portSelect" style="flex:1; min-width: 200px;" onchange="saveSetting('port', this.value)">
                    <option value="">No COM ports found</option>
                </select>
                <button class="btn-small" onclick="refreshPorts(true)">↻ Refresh</button>
            </div>
            <div class="row">
                <label>Images:
                    <select id="ditherMode" onchange="saveSetting('dither', this.value); renderCanvas()">
                        <option value="floyd">Floyd–Steinberg dithering</option>
                        <option value="threshold">Threshold (no dithering)</option>
                    </select>
                </label>
                <label><input type="checkbox" id="invertBW" onchange="renderCanvas()"> Invert black / white</label>
            </div>
            <div class="row">
                <label style="display:flex; align-items:center; gap:8px; flex:1;">Threshold
                    <input type="range" id="threshold" min="1" max="254" value="160" style="flex:1"
                           oninput="document.getElementById('thresholdVal').innerText = this.value; saveSetting('threshold', this.value); renderCanvas()">
                    <span id="thresholdVal" style="width:28px; text-align:right">160</span>
                </label>
            </div>
            <div class="row">
                <label>Packet delay:
                    <input type="number" id="packetDelay" value="0.02" min="0" max="0.5" step="0.01" style="width: 72px;" onchange="saveSetting('delay', this.value)"> s
                </label>
                <label><input type="checkbox" id="showMono" checked onchange="renderCanvas()"> Show exact 1-bit print preview</label>
            </div>

            <div class="print-actions">
                <button id="printBtn" class="print-btn" onclick="startPrint()">🖨 Print</button>
                <button class="save-btn" onclick="downloadImage()">Save PNG</button>
            </div>
            <div class="progress"><div id="progressBar"></div></div>
            <div id="statusText">Ready</div>
            <details>
                <summary>Log</summary>
                <div id="logBox"></div>
            </details>
        </div>

        <div class="panel preview-box">
            <label id="canvasLabel">864px Canvas Preview (Left 249px blank padding; content centered inside right 615px zone)</label>
            <div class="canvas-wrap"><canvas id="canvas" width="864" height="200"></canvas></div>
        </div>
    </aside>
</main>

<div id="toast"></div>

<script>
    const CANVAS_WIDTH = 864;       // 80mm print head width
    const MAX_CANVAS_HEIGHT = 32000; // browser canvas limit safety margin
    let currentMode = '57_right';

    function getActiveWidth() { return currentMode === '57_right' ? 615 : 864; }       // 615px = 57mm paper
    function getOffsetX()     { return currentMode === '57_right' ? (CANVAS_WIDTH - 615) : 0; }

    // ------------------------------------------------------------------ helpers
    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function cssFamily(name) { return `"${String(name).replace(/["\\]/g, '')}"`; }
    function clampInt(v, lo, hi, dflt) { v = parseInt(v, 10); if (isNaN(v)) v = dflt; return Math.min(hi, Math.max(lo, v)); }

    let toastTimer = null;
    function toast(msg, kind = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'show ' + kind;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.className = kind; }, kind === 'error' ? 6000 : 3500);
    }
    function saveSetting(k, v) { try { localStorage.setItem('orgbro.' + k, v); } catch (e) {} }
    function loadSetting(k) { try { return localStorage.getItem('orgbro.' + k); } catch (e) { return null; } }

    // ------------------------------------------------------------------ backend (Python app)
    const API_TOKEN = document.querySelector('meta[name="orgbro-token"]').content;
    let backendOnline = false;

    async function api(name, payload = {}) {
        const res = await fetch('/api/' + name, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Orgbro-Token': API_TOKEN },
            body: JSON.stringify(payload)
        });
        let data = {};
        try { data = await res.json(); } catch (e) {}
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
    }

    function setBackendPill(on) {
        const p = document.getElementById('backendPill');
        p.className = 'pill ' + (on ? 'on' : 'off');
        p.textContent = on ? 'Printer service ready' : 'Editor only — printing unavailable';
        document.getElementById('printBtn').disabled = !on;
    }

    async function initBackend() {
        if (!location.protocol.startsWith('http') || API_TOKEN.startsWith('__')) { setBackendPill(false); return; }
        try {
            await api('ping');
            backendOnline = true;
            setBackendPill(true);
            await refreshPorts(false);
        } catch (e) {
            setBackendPill(false);
        }
    }

    async function refreshPorts(announce) {
        if (!backendOnline) { toast('Printing needs the ORGBRO X3 Studio app.', 'error'); return; }
        const sel = document.getElementById('portSelect');
        try {
            const { ports } = await api('ports');
            const saved = sel.value || loadSetting('port');
            sel.innerHTML = ports.length
                ? ports.map(p => `<option value="${escapeHtml(p.device)}">${escapeHtml(p.device)} — ${escapeHtml(p.description)}</option>`).join('')
                : '<option value="">No COM ports found — pair the printer in Windows Bluetooth settings</option>';
            if (saved && ports.some(p => p.device === saved)) sel.value = saved;
            if (announce) toast(`Found ${ports.length} COM port${ports.length === 1 ? '' : 's'}.`);
        } catch (e) {
            toast('Could not list COM ports: ' + e.message, 'error');
        }
    }

    // ------------------------------------------------------------------ fonts
    let availableFonts = [
        { name: 'Inter (Sans-Serif)', family: 'Inter' },
        { name: 'Montserrat (Ultra Bold)', family: 'Montserrat' },
        { name: 'Oswald (Tall Display)', family: 'Oswald' },
        { name: 'Bungee (Block Poster)', family: 'Bungee' },
        { name: 'Press Start 2P (8-Bit Retro)', family: "'Press Start 2P'" },
        { name: 'VT323 (Arcade Pixel)', family: 'VT323' },
        { name: 'Courier Prime (Typewriter)', family: "'Courier Prime'" },
        { name: 'Special Elite (Vintage Stamp)', family: "'Special Elite'" },
        { name: 'Fira Code (Code Mono)', family: "'Fira Code'" },
        { name: 'Roboto Mono (Clean Mono)', family: "'Roboto Mono'" },
        { name: 'Libre Baskerville (Serif)', family: "'Libre Baskerville'" },
        { name: 'Pacifico (Cursive Script)', family: 'Pacifico' },
        { name: 'Caveat (Handwritten)', family: 'Caveat' },
        { name: 'Arial (System)', family: 'Arial' },
        { name: 'Times New Roman (System)', family: "'Times New Roman'" },
        { name: 'Courier New (System)', family: "'Courier New'" },
        { name: 'Comic Sans MS (System)', family: "'Comic Sans MS'" },
        { name: 'Impact (System)', family: 'Impact' },
        { name: 'Georgia (System)', family: 'Georgia' },
        { name: 'Verdana (System)', family: 'Verdana' },
        { name: 'Tahoma (System)', family: 'Tahoma' },
        { name: 'Trebuchet MS (System)', family: "'Trebuchet MS'" },
        { name: 'Consolas (System)', family: 'Consolas' },
        { name: 'Segoe UI (System)', family: "'Segoe UI'" },
        { name: 'CUSTOM (Type Name)', family: 'CUSTOM' }
    ];
    let systemFontsLoaded = false;

    async function loadSystemFonts() {
        if (systemFontsLoaded) { toast('System fonts are already in the font lists.'); return; }
        let names = [];
        try {
            if (backendOnline) {
                names = (await api('fonts')).fonts;
            } else if ('queryLocalFonts' in window) {
                names = [...new Set((await window.queryLocalFonts()).map(f => f.family))].sort();
            } else {
                toast('Font scanning is not available here. Choose "CUSTOM (Type Name)" and type a font name instead.', 'error');
                return;
            }
        } catch (e) {
            toast('Font scan failed: ' + e.message, 'error');
            return;
        }
        const scanned = names.map(f => ({ name: `[System] ${f}`, family: cssFamily(f) }));
        availableFonts = [...scanned, ...availableFonts];
        systemFontsLoaded = true;
        toast(`Added ${scanned.length} system fonts.`, 'ok');
        renderUI();
    }

    function fontStringFor(block) {
        let style = '';
        if (block.isItalic) style += 'italic ';
        if (block.isBold) style += 'bold ';
        let family = block.font;
        if (block.font === 'CUSTOM') {
            family = block.customFontName ? `${cssFamily(block.customFontName)}, sans-serif` : 'sans-serif';
        }
        return `${style}${block.size}px ${family}`;
    }

    // Web fonts load lazily; make sure each font is fetched before it is drawn on the canvas.
    const requestedFonts = new Set();
    function ensureFontsLoaded() {
        const pending = [];
        blocks.filter(b => b.type === 'text').forEach(b => {
            const f = fontStringFor(b);
            if (!requestedFonts.has(f)) {
                requestedFonts.add(f);
                pending.push(document.fonts.load(f, b.text || 'A').catch(() => {}));
            }
        });
        return pending.length ? Promise.all(pending).then(() => true) : Promise.resolve(false);
    }

    // ------------------------------------------------------------------ blocks
    let nextId = 1;
    let blocks = [{
        id: nextId++, type: 'text', text: 'ORGBRO X3 STICKER', font: 'Montserrat', customFontName: '',
        size: 32, isBold: true, isItalic: false, isUnderline: false, align: 'center'
    }];

    function setLayoutMode(mode) {
        currentMode = mode;
        document.getElementById('btnRight57').classList.toggle('active', mode === '57_right');
        document.getElementById('btnFull80').classList.toggle('active', mode === '80_full');
        document.getElementById('canvasLabel').innerText = mode === '57_right'
            ? '864px Canvas Preview (Left 249px blank padding; content centered inside right 615px zone)'
            : '864px Canvas Preview (Standard full-width 80mm printing area)';
        saveSetting('mode', mode);
        renderUI();
        renderCanvas();
    }

    function triggerImageUpload() { document.getElementById('hiddenFileInput').click(); }

    function addTextBlock() {
        blocks.push({
            id: nextId++, type: 'text', text: 'Type text here...', font: 'Inter', customFontName: '',
            size: 28, isBold: false, isItalic: false, isUnderline: false, align: 'center'
        });
        renderUI();
        renderCanvas();
    }

    function addImageBlock(event) {
        const file = event.target.files[0];
        if (!file) return;
        const img = new Image();
        img.onload = () => {
            blocks.push({ id: nextId++, type: 'image', imageElement: img, fileName: file.name, scalePercent: 100, align: 'center', repeatImage: 1 });
            event.target.value = '';
            renderUI();
            renderCanvas();
        };
        img.onerror = () => toast('That image could not be opened.', 'error');
        img.src = URL.createObjectURL(file);
    }

    function deleteBlock(id) { blocks = blocks.filter(b => b.id !== id); renderUI(); renderCanvas(); }

    function moveBlock(index, direction) {
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= blocks.length) return;
        [blocks[index], blocks[newIndex]] = [blocks[newIndex], blocks[index]];
        renderUI();
        renderCanvas();
    }

    function findBlock(id) { return blocks.find(b => b.id === id); }
    function updateBlockText(id, value) { const b = findBlock(id); if (b) { b.text = value; renderCanvas(); } }
    function updateCustomFont(id, value) { const b = findBlock(id); if (b) { b.customFontName = value; renderCanvas(); } }
    function updateBlockProperty(id, key, value) {
        const b = findBlock(id);
        if (!b) return;
        b[key] = value;
        if (key === 'font') renderUI();
        renderCanvas();
    }
    function toggleStyle(id, prop) { const b = findBlock(id); if (b) { b[prop] = !b[prop]; renderUI(); renderCanvas(); } }

    function alignSelect(block) {
        return `<select onchange="updateBlockProperty(${block.id}, 'align', this.value)">
            <option value="center" ${block.align === 'center' ? 'selected' : ''}>Center Align</option>
            <option value="left" ${block.align === 'left' ? 'selected' : ''}>Left Align</option>
            <option value="right" ${block.align === 'right' ? 'selected' : ''}>Right Align</option>
        </select>`;
    }
    function blockHeader(label, block, index) {
        return `<div class="block-header">
            <span>${label} #${index + 1}</span>
            <div>
                <button class="btn-move" title="Move up" onclick="moveBlock(${index}, -1)">▲</button>
                <button class="btn-move" title="Move down" onclick="moveBlock(${index}, 1)">▼</button>
                <button class="btn-delete" onclick="deleteBlock(${block.id})">Delete</button>
            </div>
        </div>`;
    }

    function renderUI() {
        const container = document.getElementById('blocksContainer');
        container.innerHTML = '';

        blocks.forEach((block, index) => {
            const item = document.createElement('div');
            item.className = 'block-item';

            if (block.type === 'text') {
                const fontOptions = availableFonts.map(f =>
                    `<option value="${escapeHtml(f.family)}" ${block.font === f.family ? 'selected' : ''}>${escapeHtml(f.name)}</option>`
                ).join('');
                const customDisplay = block.font === 'CUSTOM' ? '' : 'display:none;';

                item.innerHTML = `
                    ${blockHeader('Text Block', block, index)}
                    <textarea rows="2" oninput="updateBlockText(${block.id}, this.value)">${escapeHtml(block.text)}</textarea>
                    <div class="controls-row">
                        <select style="max-width: 240px;" onchange="updateBlockProperty(${block.id}, 'font', this.value)">${fontOptions}</select>
                        <input type="text" placeholder="Font name (e.g. Segoe UI)" value="${escapeHtml(block.customFontName)}" style="${customDisplay} width: 160px;" oninput="updateCustomFont(${block.id}, this.value)">
                        <input type="number" title="Font size (px)" value="${block.size}" min="10" max="300" style="width: 70px;" onchange="updateBlockProperty(${block.id}, 'size', clampInt(this.value, 6, 300, 28))">
                        <button class="toggle-btn ${block.isBold ? 'active' : ''}" onclick="toggleStyle(${block.id}, 'isBold')"><b>B</b></button>
                        <button class="toggle-btn ${block.isItalic ? 'active' : ''}" onclick="toggleStyle(${block.id}, 'isItalic')"><i>I</i></button>
                        <button class="toggle-btn ${block.isUnderline ? 'active' : ''}" onclick="toggleStyle(${block.id}, 'isUnderline')"><u>U</u></button>
                        ${alignSelect(block)}
                    </div>`;
            } else if (block.type === 'image') {
                item.innerHTML = `
                    ${blockHeader('Image Block', block, index)}
                    <div class="muted">${escapeHtml(block.fileName || '')}</div>
                    <div class="controls-row">
                        <label style="font-size:0.85rem; color:#38bdf8;">Scale Width:
                            <input type="range" min="10" max="100" value="${block.scalePercent || 100}" oninput="updateBlockProperty(${block.id}, 'scalePercent', parseInt(this.value, 10)); this.nextElementSibling.innerText=this.value+'%';">
                            <span>${block.scalePercent || 100}%</span>
                        </label>
                        ${alignSelect(block)}
                        <label style="font-size:0.85rem; color:#38bdf8;">Repeat Image:
                            <input type="number" value="${block.repeatImage || 1}" min="1" max="50" style="width: 55px;" onchange="updateBlockProperty(${block.id}, 'repeatImage', clampInt(this.value, 1, 50, 1))"> x
                        </label>
                    </div>`;
            }
            container.appendChild(item);
        });
    }

    // ------------------------------------------------------------------ rendering
    function wrapText(ctx, text, maxWidth) {
        const lines = [];
        text.split('\n').forEach(p => {
            let currentLine = '';
            p.split(' ').forEach(word => {
                const testLine = currentLine ? `${currentLine} ${word}` : word;
                if (ctx.measureText(testLine).width > maxWidth && currentLine !== '') {
                    lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            });
            lines.push(currentLine);
        });
        return lines;
    }

    function getSettings() {
        return {
            repeats: clampInt(document.getElementById('repeatCount').value, 1, 50, 1),
            showCutLines: document.getElementById('showCutLines').checked,
            gap: clampInt(document.getElementById('stickerGap').value, 0, 500, 0),
            dither: document.getElementById('ditherMode').value,
            threshold: clampInt(document.getElementById('threshold').value, 1, 254, 160),
            invert: document.getElementById('invertBW').checked,
            showMono: document.getElementById('showMono').checked,
        };
    }

    // Image block -> black/white canvas at target size (cached per render).
    function processImage(block, w, h, settings) {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const x = c.getContext('2d');
        x.fillStyle = '#ffffff';              // transparent PNG areas print as white, not black
        x.fillRect(0, 0, w, h);
        x.drawImage(block.imageElement, 0, 0, w, h);
        const imgData = x.getImageData(0, 0, w, h);
        const d = imgData.data;
        const gray = new Float32Array(w * h);
        for (let i = 0, p = 0; p < gray.length; i += 4, p++) gray[p] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];

        if (settings.dither === 'floyd') {
            for (let yy = 0; yy < h; yy++) {
                for (let xx = 0; xx < w; xx++) {
                    const p = yy * w + xx;
                    const old = gray[p];
                    const nv = old < 128 ? 0 : 255;
                    gray[p] = nv;
                    const err = old - nv;
                    if (xx + 1 < w) gray[p + 1] += err * 7 / 16;
                    if (yy + 1 < h) {
                        if (xx > 0) gray[p + w - 1] += err * 3 / 16;
                        gray[p + w] += err * 5 / 16;
                        if (xx + 1 < w) gray[p + w + 1] += err * 1 / 16;
                    }
                }
            }
        } else {
            for (let p = 0; p < gray.length; p++) gray[p] = gray[p] < settings.threshold ? 0 : 255;
        }
        for (let i = 0, p = 0; p < gray.length; i += 4, p++) { d[i] = d[i + 1] = d[i + 2] = gray[p]; d[i + 3] = 255; }
        x.putImageData(imgData, 0, 0);
        return c;
    }

    // Lays out every block. When draw=false only measures; returns total height.
    function layout(ctx, draw, settings, imageCache) {
        const printWidth = getActiveWidth();
        const offsetX = getOffsetX();
        const sideMargin = 15;
        const maxTextWidth = printWidth - sideMargin * 2;
        let y = 20;

        for (let r = 0; r < settings.repeats; r++) {
            blocks.forEach(block => {
                if (block.type === 'image') {
                    const img = block.imageElement;
                    const count = block.repeatImage || 1;
                    const tw = Math.max(1, Math.floor(printWidth * (block.scalePercent || 100) / 100));
                    const th = Math.max(1, Math.floor(img.height * tw / img.width));
                    let x = offsetX + (printWidth - tw) / 2;
                    if (block.align === 'left') x = offsetX + sideMargin;
                    if (block.align === 'right') x = offsetX + printWidth - sideMargin - tw;
                    let processed = null;
                    if (draw) {
                        processed = imageCache.get(block.id);
                        if (!processed) { processed = processImage(block, tw, th, settings); imageCache.set(block.id, processed); }
                    }
                    for (let i = 0; i < count; i++) {
                        if (draw) ctx.drawImage(processed, Math.round(x), Math.round(y));
                        y += th + 15;
                    }
                } else if (block.type === 'text') {
                    ctx.font = fontStringFor(block);
                    ctx.textBaseline = 'top';
                    ctx.fillStyle = '#000000';
                    const lines = wrapText(ctx, block.text, maxTextWidth);
                    const lineHeight = block.size * 1.35;
                    lines.forEach(line => {
                        if (draw) {
                            let x = offsetX + printWidth / 2;
                            ctx.textAlign = 'center';
                            if (block.align === 'left') { ctx.textAlign = 'left'; x = offsetX + sideMargin; }
                            if (block.align === 'right') { ctx.textAlign = 'right'; x = offsetX + printWidth - sideMargin; }
                            ctx.fillText(line, x, y);
                            if (block.isUnderline) {
                                const tw = ctx.measureText(line).width;
                                let ux = x - tw / 2;
                                if (block.align === 'left') ux = x;
                                if (block.align === 'right') ux = x - tw;
                                ctx.fillRect(ux, y + block.size + 3, tw, Math.max(2, block.size / 14));
                            }
                        }
                        y += lineHeight;
                    });
                    y += 15;
                }
            });

            if (r < settings.repeats - 1) {
                y += Math.floor(settings.gap / 2);
                if (draw && settings.showCutLines) {
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([8, 8]);
                    ctx.beginPath();
                    ctx.moveTo(offsetX + 10, y);
                    ctx.lineTo(offsetX + printWidth - 10, y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                y += Math.floor(settings.gap / 2);
            }
        }
        return y + 20;
    }

    // Final pass: hard black/white (what the printer actually prints) + optional invert inside the paper zone.
    function finalizePixels(ctx, w, h, settings, mono) {
        if (!mono && !settings.invert) return;
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        const x0 = getOffsetX(), x1 = x0 + getActiveWidth();
        for (let yy = 0; yy < h; yy++) {
            for (let xx = 0; xx < w; xx++) {
                const i = (yy * w + xx) * 4;
                let v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                if (mono) v = v < settings.threshold ? 0 : 255;
                if (settings.invert && xx >= x0 && xx < x1) v = 255 - v;
                d[i] = d[i + 1] = d[i + 2] = v;
                d[i + 3] = 255;
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    // Renders the layout into a canvas. forPrint => exact 1-bit output with no guide lines.
    function renderInto(canvas, forPrint) {
        const settings = getSettings();
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = CANVAS_WIDTH;

        let height = Math.ceil(layout(ctx, false, settings, null));
        let clipped = false;
        if (height > MAX_CANVAS_HEIGHT) { height = MAX_CANVAS_HEIGHT; clipped = true; }
        canvas.height = Math.max(100, height);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        layout(ctx, true, settings, new Map());
        finalizePixels(ctx, canvas.width, canvas.height, settings, forPrint || settings.showMono);

        if (!forPrint && currentMode === '57_right') {   // on-screen paper edge guide only
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(getOffsetX() + 0.5, 0);
            ctx.lineTo(getOffsetX() + 0.5, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        return { canvas, clipped };
    }

    let renderQueued = false;
    function renderCanvas() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => {
            renderQueued = false;
            const { clipped } = renderInto(document.getElementById('canvas'), false);
            if (clipped) toast('Layout is very long and was cut off — reduce repeats or image sizes.', 'error');
            ensureFontsLoaded().then(changed => { if (changed) renderCanvas(); });
        });
    }

    async function buildPrintImage() {
        await ensureFontsLoaded();
        await document.fonts.ready;
        return renderInto(document.createElement('canvas'), true).canvas;
    }

    // ------------------------------------------------------------------ print / save
    let printing = false;
    let logIndex = 0;

    function appendLog(lines) {
        if (!lines.length) return;
        const box = document.getElementById('logBox');
        box.textContent += lines.join('\n') + '\n';
        box.scrollTop = box.scrollHeight;
    }

    function setPrinting(on) {
        printing = on;
        const btn = document.getElementById('printBtn');
        btn.textContent = on ? '✖ Cancel' : '🖨 Print';
        btn.classList.toggle('cancel-btn', on);
        btn.onclick = on ? cancelPrint : startPrint;
    }

    async function startPrint() {
        if (printing) return;
        if (!backendOnline) { toast('Printing needs the ORGBRO X3 Studio app.', 'error'); return; }
        const port = document.getElementById('portSelect').value;
        if (!port) { toast('Choose the Bluetooth COM port of your ORGBRO X3 first.', 'error'); return; }

        setPrinting(true);
        document.getElementById('statusText').textContent = 'Preparing print job…';
        document.getElementById('progressBar').style.width = '0%';
        try {
            const canvas = await buildPrintImage();
            await api('print', {
                image: canvas.toDataURL('image/png'),
                port,
                delay: parseFloat(document.getElementById('packetDelay').value) || 0.02
            });
            pollStatus();
        } catch (e) {
            setPrinting(false);
            document.getElementById('statusText').textContent = 'Print failed.';
            toast(e.message, 'error');
        }
    }

    async function cancelPrint() {
        try { await api('cancel'); } catch (e) {}
        document.getElementById('statusText').textContent = 'Cancelling…';
    }

    async function pollStatus() {
        try {
            const s = await api('status', { since: logIndex });
            logIndex = s.next;
            appendLog(s.log);
            document.getElementById('progressBar').style.width = Math.round(s.progress) + '%';
            document.getElementById('statusText').textContent = s.message;
            if (s.state === 'printing') { setTimeout(pollStatus, 250); return; }
            setPrinting(false);
            if (s.state === 'done') toast('Print finished.', 'ok');
            else if (s.state === 'error') toast(s.message, 'error');
            else if (s.state === 'cancelled') toast('Print cancelled.');
        } catch (e) {
            setTimeout(pollStatus, 1000);
        }
    }

    async function downloadImage() {
        const canvas = await buildPrintImage();
        const filename = `orgbro_x3_${currentMode === '57_right' ? '57mm_right_zone' : '80mm_full'}_print.png`;
        const dataUrl = canvas.toDataURL('image/png');
        if (backendOnline) {
            try {
                const r = await api('save_png', { image: dataUrl, filename });
                if (r.saved) { toast('Saved: ' + r.saved, 'ok'); return; }
                if (r.cancelled) return;
            } catch (e) {
                toast('Save failed: ' + e.message, 'error');
                return;
            }
        }
        const link = document.createElement('a');
        link.download = filename;
        link.href = dataUrl;
        link.click();
    }

    // ------------------------------------------------------------------ start-up
    (function restoreSettings() {
        const th = loadSetting('threshold');
        if (th) { document.getElementById('threshold').value = th; document.getElementById('thresholdVal').innerText = th; }
        const dl = loadSetting('delay');
        if (dl) document.getElementById('packetDelay').value = dl;
        const dm = loadSetting('dither');
        if (dm) document.getElementById('ditherMode').value = dm;
        const mode = loadSetting('mode');
        if (mode === '80_full' || mode === '57_right') currentMode = mode;
    })();

    setLayoutMode(currentMode);
    document.fonts.ready.then(() => renderCanvas());
    initBackend();
</script>
</body>
</html>
